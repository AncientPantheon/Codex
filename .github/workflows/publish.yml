name: Publish to npmjs.org

# Triggered by pushing a version tag. TWO tag shapes, each routed to
# exactly one package — NOT a shared namespace (see 2026-10-12 fix below):
#   - `vX.Y.Z`              → @ancientpantheon/codex
#   - `arweave-core-vX.Y.Z` → @ancientpantheon/arweave-core
#
# FIX (2026-10-12): codex and arweave-core used to share the plain `vX.Y.Z`
# tag namespace, each matched purely by comparing the tag's version STRING
# against each package's own package.json version. That worked fine while
# the two packages' version numbers never coincided — until arweave-core's
# own version (0.5.0) collided with a `v0.5.0` tag already permanently used
# by codex's OWN early history (codex was briefly at 0.5.0 in 2026-07, long
# before arweave-core existed as a separate package). Every version 0.2.0
# through 1.1.0 was already claimed this way. Disambiguated by giving
# arweave-core its own prefixed tag pattern — codex keeps the original
# unprefixed `vX.Y.Z` (no change to its own tagging convention or any
# tag it has already used).
#
# The four internal packages (codex-core, codex-ui, codex-ouronet,
# codex-arweave) are `"private": true` and never enter the publish queue.
#
# Use cases:
#   - codex-only release: tag `vX.Y.Z` matching codex's package.json.
#   - arweave-core-only release: tag `arweave-core-vX.Y.Z` matching
#     arweave-core's package.json.
#   - Both in one go: push both tags (two separate workflow runs — each
#     tag shape can only ever route to its own one package now, so a
#     single tag can no longer trigger both the way a collision-prone
#     shared `vX.Y.Z` theoretically could have).
#
# Each pushed tag MUST match its own routed package's current version —
# otherwise the tag is wrong and the workflow fails before npm sees a
# single byte.
#
# Doc gates (README + CHANGELOG version-parity) only apply to packages in
# the publish queue. A non-published package's docs are untouched.
#
# AUTHENTICATION IS OIDC TRUSTED PUBLISHING, NOT A TOKEN (as of 2026-10-14).
# npmjs.com trusts this repository + this exact workflow FILENAME (extension
# included — renaming this file breaks the connection until it is recreated
# to match) + this exact environment name directly, so there is normally no
# long-lived secret to leak, rotate, or let expire. Four things make this
# actually work, learned the hard way on the sibling ouronet-libs repo and
# mirrored here rather than re-discovered:
#
#   1. `permissions: id-token: write` (job level, below) — without it there
#      is no OIDC token to exchange at all.
#   2. `actions/setup-node` MUST be given `registry-url:`. WITHOUT THIS npm
#      never even attempts the OIDC exchange — it fails in ~1.5s with
#      ENEEDAUTH, which reads exactly like "you forgot to log in" and sends
#      you looking for a missing token that was never the problem.
#   3. `npm` must be >= 11.5.1. `setup-node` still ships npm 10.x with Node
#      22, so the upgrade step below is REQUIRED, not hygiene.
#   4. `npm publish` must run FROM THE PACKAGE'S OWN DIRECTORY
#      (`working-directory:`), NOT via `npm publish --workspace=...` from
#      the monorepo root — npm resolves which package it's authenticating
#      AS for the OIDC exchange from the current working directory, and at
#      a monorepo root that resolves to the private root manifest, not the
#      package actually being published.
#
# `repository.url` in each published package's package.json must also match
# this GitHub repo, or `--provenance` fails at upload (E422, sigstore) AFTER
# the tarball is already built — confirmed already correct for both
# @ancientpantheon/codex and @ancientpantheon/arweave-core.
#
# A brand-new npmjs.com Trusted Publisher connection reads "Pending
# validation" until ONE publish actually lands through it — OIDC exchanges
# 404 on every attempt before that first publish, which is circular. Each
# publish step below tries OIDC first, always, and only falls back to the
# existing `NPM_PUBLISHER` token secret to break that one-time bootstrap
# loop if OIDC genuinely fails. Once a release has gone out via OIDC for a
# given package, that package's fallback branch is dead code — safe to
# delete `NPM_PUBLISHER` from repo secrets, not required before.
#
# `workflow_dispatch` (below) exists ONLY to run the OIDC exchange probe
# without publishing anything — the probe asks npm's own exchange endpoint
# whether the trusted publisher actually matches, in ~40s, instead of
# finding out six CI runs later on a real tag push. The probe must live IN
# this file, because the OIDC claim names the workflow file by path; a probe
# anywhere else proves nothing about this one.

on:
  push:
    tags:
      - "v*"
      - "arweave-core-v*"
  workflow_dispatch:

jobs:
  publish:
    name: Smart per-package publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The default GITHUB_TOKEN has read-only `contents` scope. Creating a
    # Release via `gh release create` requires `contents: write`.
    # `id-token: write` does double duty: it is required for npm Trusted
    # Publishing itself (`npm publish` exchanges this OIDC token for a
    # short-lived npm credential) AND for the `--provenance` SLSA attestation
    # linking the published tarball to the exact workflow run that produced
    # it.
    permissions:
      contents: write
      id-token: write

    # This name is load-bearing for Trusted Publishing, not just GitHub's own
    # protection rules: npmjs.com's Trusted Publisher entry for
    # @ancientpantheon/codex and @ancientpantheon/arweave-core must have its
    # "Environment name" field set to exactly `npm-publish` to match the OIDC
    # claim this environment causes GitHub to issue. (If a connection's job
    # declared no `environment:` at all, its npm-side field must be left
    # BLANK instead — setting one side only guarantees a mismatch.) The
    # `npm-publish` environment already exists in repo Settings →
    # Environments (confirmed via `gh api repos/AncientPantheon/Codex/
    # environments`); see .github/SECURITY-CHECKLIST.md for the rest of the
    # settings-side setup.
    environment: npm-publish

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # No git-persisted token: the release step authenticates via GH_TOKEN
          # env, and a token left in .git/config would be readable by every
          # transitive lifecycle/test path — combined with tag-push publish that
          # is a repo-write vector this job never needs.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
          # REQUIRED FOR OIDC, not cosmetic: this is what gives npm a registry
          # context to attempt the token exchange against. Without it npm
          # never tries OIDC at all and fails in ~1.5s with ENEEDAUTH, which
          # reads exactly like "you forgot to log in".
          registry-url: 'https://registry.npmjs.org'

      # TRUSTED PUBLISHING NEEDS npm >= 11.5.1, and setup-node still ships
      # npm 10.x with Node 22. Without this upgrade, `npm publish` falls back
      # to looking for an auth token that no longer exists and fails with a
      # 404 that reads like a missing package — this is not hygiene, it is a
      # hard prerequisite.
      #
      # PINNED to an 11.x version, NOT `npm@latest`. npm 12 changed
      # `allow-remote`'s default from `all` to `none` — a real, separate
      # supply-chain hardening change, confirmed directly: `npm@latest`
      # resolved to 12.2.0 here and `npm ci` then refused a legitimate
      # transitive dependency (`viem`, via `@ardrive/turbo-sdk`, pins its own
      # `ox` dependency to a non-registry `pkg.pr.new` preview URL) with
      # `EALLOWREMOTE`. 11.21.0 clears the >= 11.5.1 OIDC floor with none of
      # npm 12's new default lockdown.
      - name: Upgrade npm (OIDC trusted publishing support)
        run: |
          npm install -g npm@11.21.0
          echo "npm $(npm --version)"

      - name: OIDC preflight (does this runner have an id-token to exchange?)
        run: |
          echo "npm            : $(npm --version)"
          echo "ID token URL   : ${ACTIONS_ID_TOKEN_REQUEST_URL:+present}${ACTIONS_ID_TOKEN_REQUEST_URL:-ABSENT}"
          echo "ID token value : ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+present}${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-ABSENT}"
          echo "repo           : ${GITHUB_REPOSITORY}"
          echo "workflow ref   : ${GITHUB_WORKFLOW_REF}"

      # Publishes NOTHING. Asks npm's own exchange endpoint whether each
      # package's trusted-publisher connection actually matches this repo +
      # this workflow file + this environment, for both public packages.
      # 201 Created (not 200) means the exchange SUCCEEDED and minted a
      # token — checking for 200 alone reported a real match as a failure
      # the first time this was built, which is worse than no check at all
      # because it is believed.
      - name: OIDC exchange probe (do the trusted publishers actually match?)
        run: |
          set -o pipefail
          TOK=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm%3Aregistry.npmjs.org" \
                | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          for PKG in "@ancientpantheon%2fcodex" "@ancientpantheon%2farweave-core"; do
            CODE=$(curl -sS -o /tmp/exchange.json -w '%{http_code}' -X POST \
                   -H "Authorization: Bearer ${TOK}" -H "Content-Type: application/json" \
                   "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${PKG}")
            echo "── ${PKG} ── exchange HTTP ${CODE}"
            sed -E 's/"token":"[^"]*"/"token":"***"/g' /tmp/exchange.json || true
            echo
            if [ "${CODE}" = "201" ] || [ "${CODE}" = "200" ]; then
              echo "::notice::${PKG} trusted publisher MATCHES — a real publish will go out over OIDC."
            else
              echo "::warning::${PKG} trusted publisher did NOT match (HTTP ${CODE}). Compare the ref below"
              echo "::warning::with the connection on npmjs.com, filename extension included:"
              echo "::warning::  ${GITHUB_WORKFLOW_REF}"
              echo "::warning::If the package page shows 'Pending validation', this 404 is expected"
              echo "::warning::until one publish lands through it — see the publish steps' bootstrap"
              echo "::warning::fallback, not a sign the connection itself is wrong."
            fi
            rm -f /tmp/exchange.json
          done

      # Everything below here only runs for a real tag push — workflow_dispatch
      # exists solely for the probe above and stops here.
      - name: Install dependencies
        if: github.ref_type == 'tag'
        # npm ci uses the committed lockfile (present by tag time) so the
        # published dist/ is built from the locked, reviewed toolchain — this
        # is also what --provenance attests over. --ignore-scripts blocks
        # transitive lifecycle scripts from executing during install.
        run: npm ci --ignore-scripts

      # Belt-and-suspenders: typecheck + build + tests gate the publish so a
      # broken package never reaches the registry. The root scripts iterate
      # over all six workspaces.
      #
      # ORDER: typecheck → build → test. Build precedes test so future tests
      # resolving `exports`-map → `dist/` bare specifiers work on fresh
      # checkouts. On a CI fresh checkout `dist/` is absent until the build
      # step creates it; a test importing a package by its bare specifier
      # before build would hit ERR_MODULE_NOT_FOUND.
      - name: Build + Typecheck + Test (all packages)
        if: github.ref_type == 'tag'
        # BUILD FIRST, then typecheck + test. On a fresh checkout no package has a
        # `dist/` yet; some resolve a sibling's types via its `exports` → `dist`
        # (codex + codex-arweave → the published @ancientpantheon/arweave-core;
        # each member's vitest resolves siblings via dist too). Building first
        # emits every dist. The root `build` bootstraps the codex-ui ↔
        # codex-ouronet circular pair (see scripts/build-circular-pair.mjs) so a
        # cold full build no longer deadlocks.
        run: |
          npm run build
          npm run typecheck
          npm test

      # ------------------------------------------------------------------
      # Per-package publish-queue detection (the smart bit)
      # ------------------------------------------------------------------
      # Build a queue of the two PUBLIC packages whose `package.json`
      # version equals the tag. Subsequent steps run for each queued
      # package only. The queue is exposed via step outputs:
      #   - PUBLISH_ARWEAVE_CORE ("true" | "false")
      #   - PUBLISH_CODEX        ("true" | "false")
      #
      # If neither matches, fail the workflow — the tag is wrong.
      - name: Detect publish queue (which packages match the tag?)
        if: github.ref_type == 'tag'
        id: queue
        run: |
          REF_NAME="${GITHUB_REF#refs/tags/}"
          ARWEAVE_CORE_VERSION=$(node -p "require('./packages/arweave-core/package.json').version")
          CODEX_VERSION=$(node -p "require('./packages/codex/package.json').version")
          echo "Tag ref: $REF_NAME"
          echo "arweave-core version: $ARWEAVE_CORE_VERSION"
          echo "codex version: $CODEX_VERSION"

          PUBLISH_ARWEAVE_CORE="false"
          PUBLISH_CODEX="false"
          TAG_VERSION=""

          # Two disambiguated tag shapes (2026-10-12 fix — see file header):
          # `arweave-core-vX.Y.Z` routes ONLY to arweave-core; plain `vX.Y.Z`
          # routes ONLY to codex. Check the longer/more-specific prefix
          # first so an arweave-core tag can never also fall through to the
          # plain-`v` branch.
          if [[ "$REF_NAME" == arweave-core-v* ]]; then
            TAG_VERSION="${REF_NAME#arweave-core-v}"
            if [ "$TAG_VERSION" = "$ARWEAVE_CORE_VERSION" ]; then
              PUBLISH_ARWEAVE_CORE="true"
            fi
          elif [[ "$REF_NAME" == v* ]]; then
            TAG_VERSION="${REF_NAME#v}"
            if [ "$TAG_VERSION" = "$CODEX_VERSION" ]; then
              PUBLISH_CODEX="true"
            fi
          fi

          if [ "$PUBLISH_ARWEAVE_CORE" = "false" ] && [ "$PUBLISH_CODEX" = "false" ]; then
            echo "::error::Tag $REF_NAME did not route to a publish. Either its prefix is unrecognized (expected 'v' for codex or 'arweave-core-v' for arweave-core), or its version ($TAG_VERSION) does not match that package's current version (arweave-core=$ARWEAVE_CORE_VERSION, codex=$CODEX_VERSION)."
            echo "::error::Bump the routed package's package.json to match before tagging."
            exit 1
          fi

          echo "PUBLISH_ARWEAVE_CORE=$PUBLISH_ARWEAVE_CORE" >> "$GITHUB_OUTPUT"
          echo "PUBLISH_CODEX=$PUBLISH_CODEX"               >> "$GITHUB_OUTPUT"
          echo "TAG_VERSION=$TAG_VERSION"                   >> "$GITHUB_OUTPUT"

          echo ""
          echo "── Publish queue ──"
          echo "  @ancientpantheon/arweave-core: $PUBLISH_ARWEAVE_CORE"
          echo "  @ancientpantheon/codex:        $PUBLISH_CODEX"

      # ------------------------------------------------------------------
      # Per-queued-package README + CHANGELOG version-parity gate
      # ------------------------------------------------------------------
      # Each published package has its own README + CHANGELOG visible on
      # npmjs.com — both must reference the version being shipped, ON THE
      # PACKAGE THAT IS SHIPPING. A package not in the publish queue is
      # skipped (its docs still reflect the version that IS on npmjs.com).
      # The three grep regexes below are the load-bearing contract the
      # skeleton READMEs/CHANGELOGs are authored against.
      - name: Verify README + CHANGELOG of queued packages mention the publish version
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${{ steps.queue.outputs.TAG_VERSION }}"
          PUBLISH_ARWEAVE_CORE="${{ steps.queue.outputs.PUBLISH_ARWEAVE_CORE }}"
          PUBLISH_CODEX="${{ steps.queue.outputs.PUBLISH_CODEX }}"

          QUEUED=()
          [ "$PUBLISH_ARWEAVE_CORE" = "true" ] && QUEUED+=("packages/arweave-core")
          [ "$PUBLISH_CODEX" = "true" ] && QUEUED+=("packages/codex")

          for PKG_DIR in "${QUEUED[@]}"; do
            PKG_NAME=$(node -p "require('./${PKG_DIR}/package.json').name")
            echo "── Validating ${PKG_NAME} ──"

            # README: ## Status block must reference the version
            if ! grep -qE "\`${TAG_VERSION}\`[[:space:]]+on public npmjs" "${PKG_DIR}/README.md"; then
              echo "::error::${PKG_DIR}/README.md ## Status block does not lead with version ${TAG_VERSION}"
              echo "::error::Expected: a line containing \`${TAG_VERSION}\` on public npmjs"
              exit 1
            fi
            echo "✓ ${PKG_DIR}/README.md ## Status block references ${TAG_VERSION}"

            # README: version history must contain a **vX.Y.Z** entry
            if ! grep -qE "^\*\*v${TAG_VERSION}\*\*[[:space:]]" "${PKG_DIR}/README.md"; then
              echo "::error::${PKG_DIR}/README.md version history is missing a **v${TAG_VERSION}** paragraph"
              exit 1
            fi
            echo "✓ ${PKG_DIR}/README.md version history contains **v${TAG_VERSION}** entry"

            # CHANGELOG: first ## heading must be the version
            FIRST_HEADING=$(grep -m1 '^## ' "${PKG_DIR}/CHANGELOG.md")
            if ! echo "$FIRST_HEADING" | grep -qE "^## ${TAG_VERSION}[[:space:]]"; then
              echo "::error::${PKG_DIR}/CHANGELOG.md's first ## heading does not match version ${TAG_VERSION}"
              echo "::error::First heading found: ${FIRST_HEADING}"
              exit 1
            fi
            echo "✓ ${PKG_DIR}/CHANGELOG.md leads with: ${FIRST_HEADING}"
          done
          echo "All documentation gates passed for queued packages at v${TAG_VERSION}."

      # Non-blocking advisory gate, run BEFORE publish so the release log
      # records the supply-chain state of what is about to ship. `|| true`
      # keeps a transitive advisory from bricking a release; a non-clean audit
      # is a maintainer decision, not an automatic publish abort.
      - name: Dependency advisory audit (non-blocking)
        if: github.ref_type == 'tag'
        run: npm audit --audit-level=high --workspace=@ancientpantheon/arweave-core || true

      # ------------------------------------------------------------------
      # Idempotent publish — skip if the version already exists on npm
      # ------------------------------------------------------------------
      # If this workflow re-runs after a partial failure (e.g. a manual
      # re-tag-push), `npm publish` would fail with "version already
      # published". Pre-check via `npm view` and skip — the registry is the
      # source of truth.
      #
      # PUBLISH ORDER: arweave-core first, then codex. This is a
      # forward-looking aggregation-direction convention — the protocol
      # layer lands before the consumer-facing aggregator that will
      # eventually build on it. In this skeleton phase there are no
      # cross-package registry deps (internal members are private), so the
      # order is an ordering convention, not a present peer-dep constraint.
      #
      # EACH STEP RUNS FROM THE PACKAGE'S OWN DIRECTORY (`working-directory:`),
      # NOT via `npm publish --workspace=...` — npm resolves which package it
      # authenticates AS for the OIDC exchange from the current directory;
      # at the monorepo root that resolves to the private root manifest
      # instead of the package actually being published.
      #
      # OIDC FIRST, ALWAYS. The token-based fallback below exists only to
      # break the one-time "Pending validation" bootstrap loop a brand-new
      # trusted-publisher connection starts in (OIDC 404s on every attempt
      # until one publish has landed through it) — it is never the primary
      # or silently preferred path, and only runs after OIDC has actually
      # been tried and failed.

      - name: Publish @ancientpantheon/arweave-core to npmjs.org
        if: github.ref_type == 'tag' && steps.queue.outputs.PUBLISH_ARWEAVE_CORE == 'true'
        working-directory: packages/arweave-core
        env:
          NPM_PUBLISHER: ${{ secrets.NPM_PUBLISHER }}
        run: |
          V="${{ steps.queue.outputs.TAG_VERSION }}"
          if npm view @ancientpantheon/arweave-core@${V} version >/dev/null 2>&1; then
            echo "@ancientpantheon/arweave-core@${V} already on npm — skipping (idempotent)."
            exit 0
          fi

          # A PRERELEASE MUST NOT TAKE `latest` -- npm applies `latest` to
          # whatever it publishes unless told otherwise, prerelease or not.
          DIST=""
          case "${V}" in *-*) DIST="--tag next";; esac
          [ -n "${DIST}" ] && echo "prerelease ${V}: publishing under 'next', not 'latest'."

          if npm publish --access public --provenance ${DIST}; then
            echo "published via OIDC trusted publishing."
            exit 0
          fi

          if [ -z "${NPM_PUBLISHER}" ]; then
            echo "::error::OIDC publish failed and no NPM_PUBLISHER secret is set."
            echo "::error::If the trusted publisher still reads 'Pending validation', add a"
            echo "::error::granular token as NPM_PUBLISHER once to validate it, then delete it."
            exit 1
          fi
          echo "::warning::OIDC publish failed; falling back to the bootstrap token."
          cat > "${RUNNER_TEMP}/.npmrc" <<EOF
          //registry.npmjs.org/:_authToken=${NPM_PUBLISHER}
          EOF
          npm publish --access public --provenance ${DIST} --userconfig "${RUNNER_TEMP}/.npmrc"
          rm -f "${RUNNER_TEMP}/.npmrc"

      - name: Publish @ancientpantheon/codex to npmjs.org
        if: github.ref_type == 'tag' && steps.queue.outputs.PUBLISH_CODEX == 'true'
        working-directory: packages/codex
        env:
          NPM_PUBLISHER: ${{ secrets.NPM_PUBLISHER }}
        run: |
          V="${{ steps.queue.outputs.TAG_VERSION }}"
          if npm view @ancientpantheon/codex@${V} version >/dev/null 2>&1; then
            echo "@ancientpantheon/codex@${V} already on npm — skipping (idempotent)."
            exit 0
          fi

          DIST=""
          case "${V}" in *-*) DIST="--tag next";; esac
          [ -n "${DIST}" ] && echo "prerelease ${V}: publishing under 'next', not 'latest'."

          if npm publish --access public --provenance ${DIST}; then
            echo "published via OIDC trusted publishing."
            exit 0
          fi

          if [ -z "${NPM_PUBLISHER}" ]; then
            echo "::error::OIDC publish failed and no NPM_PUBLISHER secret is set."
            echo "::error::If the trusted publisher still reads 'Pending validation', add a"
            echo "::error::granular token as NPM_PUBLISHER once to validate it, then delete it."
            exit 1
          fi
          echo "::warning::OIDC publish failed; falling back to the bootstrap token."
          cat > "${RUNNER_TEMP}/.npmrc" <<EOF
          //registry.npmjs.org/:_authToken=${NPM_PUBLISHER}
          EOF
          npm publish --access public --provenance ${DIST} --userconfig "${RUNNER_TEMP}/.npmrc"
          rm -f "${RUNNER_TEMP}/.npmrc"

      # ------------------------------------------------------------------
      # GitHub Release creation (single Release per tag, regardless of
      # which packages it shipped)
      # ------------------------------------------------------------------
      # The Release body is the annotated-tag message, which the
      # release-author writes to cover whichever packages this tag ships.
      # Per-package granular history lives in packages/{pkg}/CHANGELOG.md
      # and on npmjs.com.
      - name: Create GitHub Release for the pushed tag
        if: github.ref_type == 'tag'
        env:
          # Prefer a user-supplied PAT (RELEASE_TOKEN) when present —
          # bypasses any org-level "Workflow permissions" lockdown that caps
          # the auto-provided GITHUB_TOKEN at read-only. Falls back to
          # GITHUB_TOKEN when the org policy allows write or when the secret
          # is unset.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Skip if Release already exists (idempotent — supports manual re-runs).
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release for $TAG already exists — skipping."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-from-tag \
              --latest
            echo "Created GitHub Release for $TAG."
          fi
